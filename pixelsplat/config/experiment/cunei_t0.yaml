# @package _global_

defaults:
  - override /dataset: cunei
  - override /model/encoder: epipolar
  - override /model/encoder/backbone: dino
  - override /model/decoder: splatting_cuda
  - override /loss: [mse, lpips]

wandb:
  name: cunei_t0
  mode: disabled

dataset:
  image_shape: [256, 256]

data_loader:
  train:
    batch_size: 4

trainer:
  max_steps: 1
  val_check_interval: null

train:
  depth_mode: null

checkpointing:
  load: /root/autodl-tmp/proj/pixelsplat/checkpoints/re10k.ckpt
