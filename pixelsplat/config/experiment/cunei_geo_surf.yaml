# @package _global_
# E 主臂：几何深度监督 + 逐高斯表面约束（在 cunei_geo 基础上只新增一种损失）
defaults:
  - override /dataset: cunei
  - override /model/encoder: epipolar
  - override /model/decoder: splatting_cuda
  - override /loss: [mse, lpips, cunei_geometry, cunei_surface]

wandb:
  name: cunei_geo_surf
  mode: disabled
  tags: [cunei, 256x256, geo-surf]

dataset:
  image_shape: [256, 256]
  ply_dir: /root/autodl-tmp/data/full_src

data_loader:
  train:
    batch_size: 4

trainer:
  max_steps: 20000
  val_check_interval: null
  check_val_every_n_epoch: 40

train:
  depth_mode: depth
