# @package _global_
# 方案A（v2 方法）：逐高斯表面监督
defaults:
  - override /dataset: cunei
  - override /model/encoder: epipolar
  - override /model/decoder: splatting_cuda
  - override /loss: [mse, lpips, cunei_surface]

wandb:
  name: cunei_surf
  mode: disabled
  tags: [cunei, 256x256, surface]

dataset:
  image_shape: [256, 256]
  ply_dir: /root/autodl-tmp/data/full_src

data_loader:
  train:
    batch_size: 2

trainer:
  max_steps: 20000
  val_check_interval: null
  check_val_every_n_epoch: 40

train:
  depth_mode: null
